spring.application.name=negocios

# Usar H2 en memoria para pruebas locales
spring.datasource.url=jdbc:h2:mem:negocios;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# generar esquema a partir de entidades
spring.jpa.hibernate.ddl-auto=create-drop

# Configuracion para que Hibernate use los nombres como estan en el modelo
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Mantener el mismo context-path que en prod
server.servlet.context-path=/negocios

# Mostrar SQL para depuración
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.api.red.negocios=DEBUG
