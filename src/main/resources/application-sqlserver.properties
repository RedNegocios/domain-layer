spring.application.name=negocios

# Configuración del servidor
server.servlet.context-path=/negocios

# Datos de conexion a SQL Server local
spring.datasource.url=jdbc:sqlserver://localhost:1433;database=RedNegocios;encrypt=false;trustServerCertificate=true;
spring.datasource.username=rodrigo
spring.datasource.password=Rodr1go#Pass
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuracion para que Hibernate use los nombres como estan en el modelo
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Hibernate DDL (create para drop+recreate, update para conservar datos)
spring.jpa.hibernate.ddl-auto=create

# Pagina de error
server.error.path=/error

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.api.red.negocios=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Mostrar SQL (útil para debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
